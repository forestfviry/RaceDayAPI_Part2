name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      Jwt__Key: "ci-only-test-key-at-least-32-characters-long!"
      Jwt__Issuer: "RaceDayAPI"
      Jwt__Audience: "RaceDayClient"
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=RaceDayCI;Trusted_Connection=False;"
      ASPNETCORE_ENVIRONMENT: "Testing"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
